name: deploy

on:
  push:
    branches: [main]
    # core/ is in here because the hub bundles soma-core's validator.
    paths: ["worker/**", "core/**", "scripts/generate-core-contract.ts", ".github/workflows/deploy.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run ruff check .
      - working-directory: worker
        run: bun test
      - working-directory: core
        run: bun install --frozen-lockfile && bun test && bun run check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # The one GH secret: this project's 1Password service-account token (see
    # new-project skill). It authenticates op for reading the deploy creds.
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: 1Password/install-cli-action@v4
      # op:// refs here are BY NAME on purpose: op-project-bootstrap parses this file to
      # provision/verify the vault + items, and names are its input (an ID cannot name a
      # vault that does not exist yet). The ONE exception to the IDs-over-names rule.
      - uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          CLOUDFLARE_API_TOKEN: op://Soma/Soma CI Cloudflare Token/api-token
          CLOUDFLARE_ACCOUNT_ID: op://Soma/Soma CI Cloudflare Token/account-id
          APNS_CONFIG: op://Soma/Soma ENV/APNS_CONFIG
          APNS_PRIVATE_KEY: op://Soma/Soma ENV/APNS_PRIVATE_KEY
          ENROLLMENT_PROFILES: op://Soma/Soma ENV/ENROLLMENT_PROFILES
          ROW_CREATION_POLICIES: op://Soma/Soma ENV/ROW_CREATION_POLICIES
          BACKUP_API_TOKEN: op://Soma/Soma ENV/BACKUP_API_TOKEN
          CAPTURE_ADAPTERS: op://Soma/Soma ENV/CAPTURE_ADAPTERS
          DERIVATIONS: op://Soma/Soma Hub Derivations Config/DERIVATIONS
      # Every deploy pushes these from the ENV item, so the vault is the source of truth.
      # ENROLLMENT_PROFILES travels gzip-compressed in numbered parts
      # (profileSecrets): one secret is capped at 5.1 kB.
      - name: Sync service secrets
        working-directory: worker
        run: |
          bun -e 'import {profileSecrets} from "./src/enrollment-profile.js";const names=["APNS_CONFIG","APNS_PRIVATE_KEY","ROW_CREATION_POLICIES","BACKUP_API_TOKEN","CAPTURE_ADAPTERS","DERIVATIONS"];const v=Object.fromEntries(names.map(n=>[n,process.env[n]]));Object.assign(v,profileSecrets(process.env.ENROLLMENT_PROFILES));process.stdout.write(JSON.stringify(v))' | bunx wrangler@4 secret bulk
      - working-directory: worker
        run: bunx wrangler@4 deploy
